name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Large native studies make checkout time variable. Observed checkout
    # (15m31s) plus the complete suite (20m30s) can exceed a 30-minute job.
    # Keep every check and test, with headroom for source transport and execution.
    timeout-minutes: 45
    env:
      # Matrix jobs run on separate ephemeral VMs, so fixed /tmp paths remain
      # isolated without using the step-only `runner.temp` context here.
      PRIMER_DB: /tmp/primer-ci.db
      PRIMER_CONTENT_DIR: /tmp/primer-content
      PRIMER_BACKUP_DIR: /tmp/primer-backups
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.lock.txt --requirement tools/requirements-math-illustrations.txt --requirement tools/requirements-anatomy-source-checks.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q api primer tests tools

      - name: Audit curriculum banks
        run: python tools/check_banks.py

      - name: Verify hosted source raster inventory
        run: python tools/check_static_raster_inventory.py

      - name: Verify hosted source motion inventory
        run: python tools/check_static_motion_inventory.py

      - name: Verify hosted source volume inventory
        run: python tools/check_static_source_volume_inventory.py

      - name: Verify complete native source studies
        run: python tools/check_static_source_study_inventory.py

      - name: Verify hosted source mesh inventory
        run: python tools/check_static_source_mesh_inventory.py

      - name: Verify source-array and generated-image reproduction
        run: python -m pytest tests/test_west_bohemia_pelvic_source.py tests/test_wt9fc_tongue_reference.py -q

      - name: Run the full test suite
        run: python -m pytest tests/ -q
