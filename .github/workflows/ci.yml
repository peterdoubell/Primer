name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Matrix jobs run on separate ephemeral VMs, so fixed /tmp paths remain
      # isolated without using the step-only `runner.temp` context here.
      PRIMER_DB: /tmp/primer-ci.db
      PRIMER_CONTENT_DIR: /tmp/primer-content
      PRIMER_BACKUP_DIR: /tmp/primer-backups
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.lock.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q api primer tests tools

      - name: Audit curriculum banks
        run: python tools/check_banks.py

      - name: Run the full test suite
        run: python -m pytest tests/ -q
