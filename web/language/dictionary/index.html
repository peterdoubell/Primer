<main><a href="/app/#/node/lang.1.dictionary">Return to Using a Dictionary</a><h1>Guide-word hunt</h1>
<p>The two guide words on each page tell you its first and last entries. Find the page for your word, then use its entry to solve the clue.</p>
<h2 id="prompt"></h2><div id="pages" aria-label="Dictionary page map"></div>
<article id="entry" hidden><h2 id="heading" tabindex="-1"></h2><p id="definition"></p><h3>Which sentence fits this meaning?</h3><div id="choices"></div></article>
<p role="status" id="feedback"></p><button id="next" hidden>Find another word</button></main><script src="hunt.js"></script></html>
