<body><main>
<a href="/app/#/node/phys.2.units">Return to Measuring the World</a>
<h1>A measurement and its uncertainty</h1>
<p class="lede">No measurement is exact. An honest result gives the value, the unit and how far off it might be.</p>
<div class="controls">
<div><label for="reading">Reading (millimetres)</label><input type="range" id="reading" min="1" max="200" step="1" value="47"><output id="reading-out" for="reading"></output></div>
<div><label for="step">Smallest division of the ruler</label><select id="step"><option value="1">1 mm</option><option value="0.5">0.5 mm</option><option value="5">5 mm</option><option value="10">1 cm</option></select></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="260" role="img" aria-label="A ruler with a band showing the range the true length could lie in. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Form</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
