<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A compass around a bar magnet · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/phys.1.magnets">Return to Magnets</a>
<h1>A compass around a bar magnet</h1>
<p class="lede">A magnet has a north pole and a south pole. A compass needle shows which way the magnet would push another north pole.</p>
<div class="controls">
<div><label for="x">Compass position across</label><input type="range" id="x" min="-4" max="4" step="0.5" value="2"><output id="x-out" for="x"></output></div>
<div><label for="y">Compass position up</label><input type="range" id="y" min="-4" max="4" step="0.5" value="1.5"><output id="y-out" for="y"></output></div>
<div><label for="facing">Bring a second magnet with this pole first</label><select id="facing"><option value="N">north pole</option><option value="S">south pole</option></select></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="700" role="img" aria-label="A bar magnet, small arrows showing its field, and a compass needle at the chosen place. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Question</th><th scope="col">Answer</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
