<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One qubit: states, gates and measurement · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/phys.5.quantum-info">Return to Quantum Information</a>
<h1>One qubit: states, gates and measurement</h1>
<p class="lede">A qubit can be in a blend of 0 and 1. Gates turn the state; measuring gives 0 or 1 with probabilities set by the amplitudes.</p>
<div class="controls">
<div><label for="theta">Polar angle θ (degrees)</label><input type="range" id="theta" min="0" max="180" step="5" value="60"><output id="theta-out" for="theta"></output></div>
<div><label for="phi">Phase φ (degrees)</label><input type="range" id="phi" min="0" max="345" step="15" value="0"><output id="phi-out" for="phi"></output></div>
<div><label for="gate">Gate applied</label><select id="gate"><option value="H">Hadamard H</option><option value="X">X (bit flip)</option><option value="Z">Z (phase flip)</option><option value="none">none</option></select></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="700" role="img" aria-label="A side view of the Bloch sphere with the state before and after the gate. The table below gives the same values."></canvas>
</figure>
<table><caption>Before and after</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Before the gate</th><th scope="col">After the gate</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
