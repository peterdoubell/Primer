<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One event seen from a moving frame · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/phys.4.relativity">Return to Relativity</a>
<h1>One event seen from a moving frame</h1>
<p class="lede">Mark an event in space and time. An observer moving past assigns it a different place and time, but both agree on the spacetime interval.</p>
<div class="controls">
<div><label for="v">Speed of the moving frame (fraction of c)</label><input type="range" id="v" min="-0.9" max="0.9" step="0.05" value="0.6"><output id="v-out" for="v"></output></div>
<div><label for="x">Position x (light-seconds)</label><input type="range" id="x" min="-4" max="4" step="0.25" value="2"><output id="x-out" for="x"></output></div>
<div><label for="t">Time t (seconds)</label><input type="range" id="t" min="-4" max="4" step="0.25" value="3"><output id="t-out" for="t"></output></div>
<div><label for="w">Speed of an object in the moving frame (fraction of c)</label><input type="range" id="w" min="-0.9" max="0.9" step="0.05" value="0.5"><output id="w-out" for="w"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="700" role="img" aria-label="A spacetime diagram with light rays, the axes of the moving frame and the event. The table below gives the same values."></canvas>
</figure>
<table><caption>The same event in two frames</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Rest frame</th><th scope="col">Moving frame</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
