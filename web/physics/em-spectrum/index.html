<a href="/app/#/node/phys.4.em-maxwell">Return to Electrodynamics</a>
<h1>One wave, every wavelength</h1>
<p class="lede">Maxwell’s equations give waves of electric and magnetic field that travel at one speed in a vacuum. Frequency alone separates radio from light from X-rays.</p>
<div class="controls">
<div><label for="power">Frequency: 10 to the power</label><input type="range" id="power" min="4" max="20" step="0.1" value="14.7"><output id="power-out" for="power"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="360" role="img" aria-label="One electromagnetic wave: the electric and magnetic fields oscillating in step. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
