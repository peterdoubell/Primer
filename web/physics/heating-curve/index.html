<body><main>
<a href="/app/#/node/phys.2.matter">Return to States of Matter</a>
<h1>Heating ice until it is steam</h1>
<p class="lede">Add heat to one kilogram of ice at −20 °C. The temperature rises, except while the ice melts and while the water boils.</p>
<div class="controls">
<div><label for="heat">Heat added (kilojoules)</label><input type="range" id="heat" min="0" max="3200" step="10" value="500"><output id="heat-out" for="heat"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="440" role="img" aria-label="Graph of temperature against heat added, with flat parts at melting and boiling. The table below gives the same values."></canvas>
</figure>
<table><caption>Stages for one kilogram</caption><thead><tr><th scope="col">Stage</th><th scope="col">Heat needed (kJ)</th><th scope="col">Temperature</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
