<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two bulbs: in series or in parallel · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/phys.2.electricity">Return to Electricity</a>
<h1>Two bulbs: in series or in parallel</h1>
<p class="lede">Current flows round a complete circuit. Connect two bulbs one after the other, or side by side, and compare.</p>
<div class="controls">
<div><label for="kind">Connection</label><select id="kind"><option value="series">Series (one after the other)</option><option value="parallel">Parallel (side by side)</option></select></div>
<div><label for="volts">Battery (volts)</label><input type="range" id="volts" min="1.5" max="12" step="1.5" value="6"><output id="volts-out" for="volts"></output></div>
<div><label for="r1">Bulb 1 resistance (ohms)</label><input type="range" id="r1" min="1" max="20" step="1" value="6"><output id="r1-out" for="r1"></output></div>
<div><label for="r2">Bulb 2 resistance (ohms)</label><input type="range" id="r2" min="1" max="20" step="1" value="12"><output id="r2-out" for="r2"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="320" role="img" aria-label="Bars showing the power of each bulb, which sets its brightness. The table below gives the same values."></canvas>
</figure>
<table><caption>Circuit values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Bulb 1</th><th scope="col">Bulb 2</th><th scope="col">Whole circuit</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
