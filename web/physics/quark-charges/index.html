<body><main>
<a href="/app/#/node/phys.4.particles">Return to Particle Physics</a>
<h1>Building particles from quarks</h1>
<p class="lede">Protons, neutrons and mesons are made of quarks. Add up the quark charges and you get the charge of the particle.</p>
<div class="controls">
<div><label for="hadron">Particle</label><select id="hadron"><option value="proton">Proton</option><option value="neutron">Neutron</option><option value="piplus">Pion π⁺</option><option value="piminus">Pion π⁻</option><option value="kplus">Kaon K⁺</option><option value="lambda">Lambda Λ</option><option value="omega">Omega Ω⁻</option><option value="deltapp">Delta Δ⁺⁺</option></select></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="300" role="img" aria-label="Bars for the charge of each quark in the chosen particle. The table below gives the same values."></canvas>
</figure>
<table><caption>The Standard Model particles</caption><thead><tr><th scope="col">Particle</th><th scope="col">Family</th><th scope="col">Charge (e)</th><th scope="col">Spin</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
