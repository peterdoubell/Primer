<body><main>
<a href="/app/#/node/phys.4.statmech">Return to Statistical Mechanics</a>
<h1>Entropy is counting</h1>
<p class="lede">Toss N coins. Each exact sequence is a microstate; the number of heads is the macrostate. The macrostates with the most microstates are overwhelmingly likely.</p>
<div class="controls">
<div><label for="n">Coins N</label><input type="range" id="n" min="2" max="40" step="1" value="10"><output id="n-out" for="n"></output></div>
<div><label for="k">Heads</label><input type="range" id="k" min="0" max="40" step="1" value="5"><output id="k-out" for="k"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="440" role="img" aria-label="Bar chart of the number of microstates for each number of heads. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
