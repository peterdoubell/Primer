<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collisions: momentum is always conserved · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/phys.3.energy-work">Return to Work, Energy and Momentum</a>
<h1>Collisions: momentum is always conserved</h1>
<p class="lede">Two carts collide on a straight track. Momentum is conserved in every collision; kinetic energy only in a perfectly bouncy one.</p>
<div class="controls">
<div><label for="m1">Mass 1 (kg)</label><input type="range" id="m1" min="1" max="10" step="1" value="2"><output id="m1-out" for="m1"></output></div>
<div><label for="v1">Velocity 1 (m/s)</label><input type="range" id="v1" min="-10" max="10" step="1" value="6"><output id="v1-out" for="v1"></output></div>
<div><label for="m2">Mass 2 (kg)</label><input type="range" id="m2" min="1" max="10" step="1" value="4"><output id="m2-out" for="m2"></output></div>
<div><label for="v2">Velocity 2 (m/s)</label><input type="range" id="v2" min="-10" max="10" step="1" value="-1"><output id="v2-out" for="v2"></output></div>
<div><label for="e">Bounciness (0 = stick, 1 = elastic)</label><input type="range" id="e" min="0" max="1" step="0.1" value="1"><output id="e-out" for="e"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="340" role="img" aria-label="The two carts with their velocity arrows before and after the collision. The table below gives the same values."></canvas>
</figure>
<table><caption>Before and after</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Before</th><th scope="col">After</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
