<body><main>
<a href="/app/#/node/phys.5.qft">Return to Quantum Field Theory</a>
<h1>Why some forces reach further than others</h1>
<p class="lede">In quantum field theory a force is carried by a field whose particle has a mass. The heavier the carrier, the shorter the reach.</p>
<div class="controls">
<div><label for="carrier">Force carrier</label><select id="carrier"><option value="pion">Pion (nuclear force between protons and neutrons)</option><option value="w">W boson (weak force)</option><option value="z">Z boson (weak force)</option><option value="photon">Photon (electromagnetism)</option></select></div>
<div><label for="r">Distance (femtometres)</label><input type="range" id="r" min="0.1" max="5" step="0.1" value="1.4"><output id="r-out" for="r"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="440" role="img" aria-label="The potential against distance for the chosen carrier, compared with a massless carrier. The table below gives the same values."></canvas>
</figure>
<table><caption>Carriers</caption><thead><tr><th scope="col">Carrier</th><th scope="col">Mass (MeV)</th><th scope="col">Range (fm)</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
