<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where shadows come from · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/phys.0.light-shadow">Return to Light and Shadow</a>
<h1>Where shadows come from</h1>
<p class="lede">Light travels in straight lines. A shadow is the place the light cannot reach. Move the lamp and watch the shadow.</p>
<div class="controls">
<div><label for="lamp">Lamp height</label><input type="range" id="lamp" min="2" max="10" step="0.5" value="5"><output id="lamp-out" for="lamp"></output></div>
<div><label for="object">Object height</label><input type="range" id="object" min="0.5" max="3" step="0.5" value="1.5"><output id="object-out" for="object"></output></div>
<div><label for="distance">Object’s distance from the lamp</label><input type="range" id="distance" min="1" max="8" step="0.5" value="3"><output id="distance-out" for="distance"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="360" role="img" aria-label="A lamp, an object and the shadow it casts along the ground. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Question</th><th scope="col">Answer</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
