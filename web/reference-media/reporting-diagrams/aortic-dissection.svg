<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-label="DeBakey and Stanford dissection classification"><title>DeBakey and Stanford dissection classification</title><rect width="100%" height="100%" fill="#fffaf3"/><style>text{font-family:Arial,sans-serif;fill:#263238}.title{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:14px}.base{fill:none;stroke:#bec9cc;stroke-width:25;stroke-linecap:round;stroke-linejoin:round}.disease{fill:none;stroke:#a52b32;stroke-width:12;stroke-linecap:round}</style><text x="28" y="36" class="title">Dissection: DeBakey extent and Stanford ascending involvement</text><text x="28" y="62" class="small">Red = dissection extent · diamond = usual entry site · simplified orientation, not patient anatomy</text><g transform="translate(20,55)"><text x="110" y="40" text-anchor="middle" class="label">DeBakey I</text><path class="base" d="M65 215 L65 155 C65 82 175 82 175 155 L175 365"/><path d="M105 110 L98 80 M134 105 L134 74 M160 120 L176 86 M175 365 L150 397 M175 365 L203 397" fill="none" stroke="#bec9cc" stroke-width="12"/><path class="disease" d="M65 211 L65 155 C65 82 175 82 175 155 L175 365"/><path d="M35 302 H223" stroke="#607d8b" stroke-dasharray="5 5"/><text x="30" y="324" class="small">Diaphragm</text><path d="M65 172 l8 8 -8 8 -8 -8 Z" fill="#fff" stroke="#771f25" stroke-width="2"/><text x="110" y="432" text-anchor="middle" class="label">Stanford A</text><text x="12" y="459" class="small">Ascending origin; extends</text><text x="12" y="479" class="small">beyond the ascending aorta.</text></g><g transform="translate(275,55)"><text x="110" y="40" text-anchor="middle" class="label">DeBakey II</text><path class="base" d="M65 215 L65 155 C65 82 175 82 175 155 L175 365"/><path d="M105 110 L98 80 M134 105 L134 74 M160 120 L176 86 M175 365 L150 397 M175 365 L203 397" fill="none" stroke="#bec9cc" stroke-width="12"/><path class="disease" d="M65 211 L65 150 Q65 125 77 117"/><path d="M35 302 H223" stroke="#607d8b" stroke-dasharray="5 5"/><text x="30" y="324" class="small">Diaphragm</text><path d="M65 172 l8 8 -8 8 -8 -8 Z" fill="#fff" stroke="#771f25" stroke-width="2"/><text x="110" y="432" text-anchor="middle" class="label">Stanford A</text><text x="12" y="459" class="small">Ascending origin; confined</text><text x="12" y="479" class="small">to the ascending aorta.</text></g><g transform="translate(530,55)"><text x="110" y="40" text-anchor="middle" class="label">DeBakey IIIa</text><path class="base" d="M65 215 L65 155 C65 82 175 82 175 155 L175 365"/><path d="M105 110 L98 80 M134 105 L134 74 M160 120 L176 86 M175 365 L150 397 M175 365 L203 397" fill="none" stroke="#bec9cc" stroke-width="12"/><path class="disease" d="M175 158 L175 275"/><path d="M35 302 H223" stroke="#607d8b" stroke-dasharray="5 5"/><text x="30" y="324" class="small">Diaphragm</text><path d="M175 159 l8 8 -8 8 -8 -8 Z" fill="#fff" stroke="#771f25" stroke-width="2"/><text x="110" y="432" text-anchor="middle" class="label">Stanford B</text><text x="12" y="459" class="small">Descending origin; confined</text><text x="12" y="479" class="small">above the diaphragm.</text></g><g transform="translate(785,55)"><text x="110" y="40" text-anchor="middle" class="label">DeBakey IIIb</text><path class="base" d="M65 215 L65 155 C65 82 175 82 175 155 L175 365"/><path d="M105 110 L98 80 M134 105 L134 74 M160 120 L176 86 M175 365 L150 397 M175 365 L203 397" fill="none" stroke="#bec9cc" stroke-width="12"/><path class="disease" d="M175 158 L175 365"/><path d="M35 302 H223" stroke="#607d8b" stroke-dasharray="5 5"/><text x="30" y="324" class="small">Diaphragm</text><path d="M175 159 l8 8 -8 8 -8 -8 Z" fill="#fff" stroke="#771f25" stroke-width="2"/><text x="110" y="432" text-anchor="middle" class="label">Stanford B</text><text x="12" y="459" class="small">Descending origin; extends</text><text x="12" y="479" class="small">below the diaphragm.</text></g><text x="28" y="574" class="small">Stanford A: any ascending involvement, even with a distal entry tear. Stanford B: no ascending involvement.</text><text x="28" y="597" class="small">Arch-only or atypical/retrograde disease: report actual tear and extent; do not force a classic DeBakey type.</text></svg>