<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 525" role="img" aria-label="Crawford thoracoabdominal aneurysm extent I to V"><title>Crawford thoracoabdominal aneurysm extent I to V</title><rect width="100%" height="100%" fill="#fffaf3"/><style>text{font-family:Arial,sans-serif;fill:#263238}.title{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:14px}.base{fill:none;stroke:#bec9cc;stroke-width:25;stroke-linecap:round;stroke-linejoin:round}.disease{fill:none;stroke:#a52b32;stroke-width:12;stroke-linecap:round}</style><text x="28" y="36" class="title">Thoracoabdominal aneurysm: Crawford extent (Safi modification)</text><text x="28" y="63" class="small">Red bars map typical involved segments. Always report actual proximal and distal landmarks.</text><text x="24" y="120" class="small">Below left subclavian</text><path d="M210 115 H995" stroke="#aeb9bc" stroke-dasharray="4 5"/><text x="24" y="195" class="small">Mid descending / T6</text><path d="M210 190 H995" stroke="#aeb9bc" stroke-dasharray="4 5"/><text x="24" y="270" class="small">Diaphragm / T12</text><path d="M210 265 H995" stroke="#aeb9bc" stroke-dasharray="4 5"/><text x="24" y="305" class="small">Coeliac / SMA</text><path d="M210 300 H995" stroke="#aeb9bc" stroke-dasharray="4 5"/><text x="24" y="355" class="small">Renal arteries</text><path d="M210 350 H995" stroke="#aeb9bc" stroke-dasharray="4 5"/><text x="24" y="435" class="small">Aortic bifurcation</text><path d="M210 430 H995" stroke="#aeb9bc" stroke-dasharray="4 5"/><text x="285" y="94" text-anchor="middle" class="label">Extent I</text><path d="M285 115 V430" class="base"/><path d="M285 115 V330" stroke="#a52b32" stroke-width="34" stroke-linecap="round"/><text x="440" y="94" text-anchor="middle" class="label">Extent II</text><path d="M440 115 V430" class="base"/><path d="M440 115 V425" stroke="#a52b32" stroke-width="34" stroke-linecap="round"/><text x="595" y="94" text-anchor="middle" class="label">Extent III</text><path d="M595 115 V430" class="base"/><path d="M595 190 V425" stroke="#a52b32" stroke-width="34" stroke-linecap="round"/><text x="750" y="94" text-anchor="middle" class="label">Extent IV</text><path d="M750 115 V430" class="base"/><path d="M750 270 V425" stroke="#a52b32" stroke-width="34" stroke-linecap="round"/><text x="905" y="94" text-anchor="middle" class="label">Extent V</text><path d="M905 115 V430" class="base"/><path d="M905 190 V330" stroke="#a52b32" stroke-width="34" stroke-linecap="round"/><text x="28" y="477" class="small">I / V: end above the renal arteries. II / III / IV: include the infrarenal abdominal aorta.</text><text x="28" y="501" class="small">For an isolated abdominal aneurysm, describe infrarenal, juxtarenal, pararenal or suprarenal extent instead.</text></svg>