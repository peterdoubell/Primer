<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Anal canal carcinoma TNM: reporting anatomy and staging pathway"><title>Anal canal carcinoma TNM</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Anal canal carcinoma TNM</text><text x="28" y="75" font-size="16" fill="#243741">AJCC Version 9 (2023): T/N reporting anchors</text><circle cx="116" cy="256" r="22" fill="#b73947"/><circle cx="213" cy="256" r="36" fill="#b73947"/><circle cx="323" cy="256" r="48" fill="#b73947"/><text x="70" y="335" font-size="17" fill="#243741">T1 ≤2 cm | T2 &gt;2–5 cm | T3 &gt;5 cm</text><text x="70" y="421" font-size="17" fill="#243741">Actual adjacent organ invasion → T4</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Measure ≤2 / &gt;2–5 / &gt;5 cm</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Adjacent organ → T4</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Map pelvic and inguinal basins</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Separate regional from distant spread</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
