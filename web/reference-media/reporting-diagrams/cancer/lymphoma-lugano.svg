<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Lymphoma Lugano extent: reporting anatomy and staging pathway"><title>Lymphoma Lugano extent</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Lymphoma Lugano extent</text><text x="28" y="75" font-size="16" fill="#243741">Lugano 2014</text><path d="M209 178V387M123 252H294M139 387L111 426M270 387L297 426" stroke="#deedf1" stroke-width="48" fill="none" stroke-linecap="round"/><circle cx="209" cy="139" r="33" fill="#deedf1"/><path d="M83 315H335" stroke="#648896" stroke-width="3" stroke-dasharray="8 5"/><circle cx="184" cy="220" r="10" fill="#c98126"/><circle cx="234" cy="220" r="10" fill="#c98126"/><circle cx="210" cy="281" r="10" fill="#c98126"/><circle cx="187" cy="365" r="10" fill="#c98126"/><text x="90" y="470" font-size="16" fill="#243741">Level / side / diaphragm relationship</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. One region → I</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Same side of diaphragm → II</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Both sides → III</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Disseminated extranodal → IV</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
