<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ovarian, tubal and primary peritoneal carcinoma FIGO: reporting anatomy and staging pathway"><title>Ovarian, tubal and primary peritoneal carcinoma FIGO</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Ovarian, tubal and primary peritoneal carcinoma FIGO</text><text x="28" y="75" font-size="16" fill="#243741">FIGO 2014</text><path d="M159 240H261M210 240V353" stroke="#648896" stroke-width="13"/><ellipse cx="118" cy="239" rx="38" ry="30" fill="#b73947"/><ellipse cx="301" cy="239" rx="38" ry="30" fill="#deedf1" stroke="#648896" stroke-width="4"/><circle cx="102" cy="325" r="9" fill="#b73947"/><circle cx="293" cy="339" r="9" fill="#b73947"/><circle cx="246" cy="174" r="9" fill="#b73947"/><text x="80" y="135" font-size="16" fill="#243741">Adnexal and peritoneal distribution</text><text x="78" y="426" font-size="16" fill="#243741">Capsular deposits ≠ organ metastasis</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Adnexal only → I</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Pelvic extension → II</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Extrapelvic peritoneum / nodes → III</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Pleural cytology / distant organs → IV</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
