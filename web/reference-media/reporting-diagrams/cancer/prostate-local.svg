<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Prostate carcinoma: imaging extent and TNM: reporting anatomy and staging pathway"><title>Prostate carcinoma: imaging extent and TNM</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Prostate carcinoma: imaging extent and TNM</text><text x="28" y="75" font-size="16" fill="#243741">UICC/AJCC 8; EAU clinical-stage conventions</text><path d="M139 193C151 151 198 181 177 218M262 193C250 151 208 181 229 218" fill="none" stroke="#648896" stroke-width="20"/><ellipse cx="207" cy="281" rx="105" ry="79" fill="#deedf1" stroke="#648896" stroke-width="5"/><path d="M207 209V355" stroke="#fff" stroke-width="16"/><circle cx="271" cy="272" r="24" fill="#b73947"/><path d="M285 272L330 282" stroke="#b73947" stroke-width="14"/><text x="70" y="133" font-size="16" fill="#243741">Seminal vesicles</text><text x="72" y="411" font-size="16" fill="#243741">Capsule → EPE; seminal vesicles separately</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. PI-RADS → suspicion</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Capsule / neurovascular bundle → EPE</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Seminal vesicle → T3b-equivalent</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. DRE + PSA + histology → clinical risk</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
