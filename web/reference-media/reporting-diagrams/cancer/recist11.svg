<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Solid-tumour response: RECIST: reporting anatomy and staging pathway"><title>Solid-tumour response: RECIST</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Solid-tumour response: RECIST</text><text x="28" y="75" font-size="16" fill="#243741">RECIST 1.1 (2009)</text><path d="M95 373V179M95 373H335" stroke="#648896" stroke-width="3" fill="none"/><path d="M114 205L211 299L308 236" stroke="#b73947" stroke-width="6" fill="none"/><text x="70" y="144" font-size="17" fill="#243741">Example target sums (mm)</text><text x="80" y="405" font-size="16" fill="#243741">100 → 70: −30% from baseline (PR)</text><text x="80" y="439" font-size="16" fill="#243741">70 → 90: +28.6%, +20 mm from nadir</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Select reproducible targets</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Compare with baseline → PR</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Compare with nadir → PD</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Non-target + new lesions → overall response</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
