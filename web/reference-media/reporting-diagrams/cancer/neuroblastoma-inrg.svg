<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Neuroblastoma INRGSS: reporting anatomy and staging pathway"><title>Neuroblastoma INRGSS</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Neuroblastoma INRGSS</text><text x="28" y="75" font-size="16" fill="#243741">Pretreatment INRG staging system</text><path d="M165 169V370M251 169V370" stroke="#648896" stroke-width="18"/><ellipse cx="167" cy="270" rx="53" ry="45" fill="#b73947"/><path d="M196 237L228 258L196 301" fill="none" stroke="#b73947" stroke-width="14"/><text x="65" y="137" font-size="16" fill="#243741">Tumour–vessel interface</text><text x="75" y="422" font-size="16" fill="#243741">Contact angle • narrowing • encasement</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Any IDRF? → L1 / L2</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Distant disease? → M</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Age + restricted sites → consider MS</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Biology + stage → clinical risk group</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
