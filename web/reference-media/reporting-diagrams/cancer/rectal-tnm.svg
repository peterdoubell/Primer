dth="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. MRF + EMVI + lateral nodes</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
