<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Cervical carcinoma FIGO: reporting anatomy and staging pathway"><title>Cervical carcinoma FIGO</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Cervical carcinoma FIGO</text><text x="28" y="75" font-size="16" fill="#243741">FIGO 2018 with corrected IB size boundaries (2019 / 2021 reference)</text><path d="M210 170C127 115 89 230 153 286L172 333V391H249V333L268 286C331 231 295 116 210 170Z" fill="#deedf1" stroke="#648896" stroke-width="4"/><path d="M210 187V271L193 335H229L210 271" fill="none" stroke="#fff" stroke-width="20"/><circle cx="210" cy="283" r="29" fill="#b73947"/><path d="M236 283L302 307" stroke="#b73947" stroke-width="13"/><text x="82" y="127" font-size="16" fill="#243741">Endometrium / myometrium</text><text x="95" y="421" font-size="16" fill="#243741">Cervix • parametria • vaginal extent</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Cervix + size → IB</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Vagina / parametria → II</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Wall / lower vagina / nodes → III</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Mucosa / distant sites → IV</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
