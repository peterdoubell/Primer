<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Lung cancer TNM: reporting anatomy and staging pathway"><title>Lung cancer TNM</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Lung cancer TNM</text><text x="28" y="75" font-size="16" fill="#243741">9th edition / Version 9 (2025)</text><path d="M210 142V215M210 190L163 229M210 190L260 229" stroke="#648896" stroke-width="12" fill="none"/><path d="M175 164C105 177 79 308 113 386L178 365Z M246 164C321 185 344 309 310 386L242 365Z" fill="#deedf1" stroke="#648896" stroke-width="4"/><circle cx="148" cy="292" r="23" fill="#b73947"/><circle cx="195" cy="223" r="9" fill="#c98126"/><circle cx="226" cy="260" r="9" fill="#c98126"/><text x="80" y="420" font-size="16" fill="#243741">Primary + pleural / mediastinal</text><text x="80" y="442" font-size="16" fill="#243741">interfaces</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Solid size → T1/T2</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Apply highest qualifying T feature</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Stations → N1/N2a/N2b/N3</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Sites → M1a/b/c1/c2</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
