<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Renal cell carcinoma TNM: reporting anatomy and staging pathway"><title>Renal cell carcinoma TNM</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Renal cell carcinoma TNM</text><text x="28" y="75" font-size="16" fill="#243741">AJCC/UICC 8 anatomical categories</text><path d="M207 151C102 145 88 260 112 343C145 418 235 370 242 322C182 325 172 245 239 220C247 189 235 164 207 151Z" fill="#deedf1" stroke="#648896" stroke-width="5"/><path d="M231 262H329V162M329 262V377" stroke="#648896" stroke-width="20" fill="none"/><path d="M168 280L237 264H327V228" stroke="#b73947" stroke-width="16" fill="none"/><circle cx="161" cy="279" r="28" fill="#b73947"/><text x="77" y="136" font-size="16" fill="#243741">Organ boundary</text><text x="250" y="408" font-size="16" fill="#243741">Vein / IVC level</text><text x="70" y="450" font-size="16" fill="#243741">Report invasion and thrombus separately</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Confined + size → T1/T2</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Vein / sinus / fat → T3a</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. IVC level / wall → T3b/c</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Beyond Gerota → T4</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
