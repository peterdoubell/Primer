<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Adrenocortical carcinoma ENSAT: reporting anatomy and staging pathway"><title>Adrenocortical carcinoma ENSAT</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Adrenocortical carcinoma ENSAT</text><text x="28" y="75" font-size="16" fill="#243741">ENSAT 2008 anatomical stage framework</text><path d="M118 213C159 192 236 191 274 215L226 137Z" fill="#deedf1" stroke="#648896" stroke-width="5"/><path d="M186 254C119 237 100 323 142 378C181 409 237 365 223 334C181 343 159 291 219 282Z" fill="#deedf1" stroke="#648896" stroke-width="4"/><circle cx="220" cy="195" r="27" fill="#b73947"/><path d="M238 204L298 250" stroke="#b73947" stroke-width="13"/><text x="76" y="115" font-size="16" fill="#243741">Adrenal gland / extra-adrenal extent</text><text x="81" y="425" font-size="16" fill="#243741">Kidney below • vessels and organs nearby</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Adrenal confined + size → I/II</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Local / venous / nodal extension → III</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Distant metastases → IV</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Histology + endocrine assessment</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
