<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Hepatoblastoma PRETEXT / POSTTEXT: reporting anatomy and staging pathway"><title>Hepatoblastoma PRETEXT / POSTTEXT</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Hepatoblastoma PRETEXT / POSTTEXT</text><text x="28" y="75" font-size="16" fill="#243741">2017 PRETEXT framework</text><path d="M86 205C177 132 286 155 342 215L309 334L95 353Z" fill="#deedf1" stroke="#648896" stroke-width="5"/><path d="M153 176L146 341M211 169L205 344M270 177L260 341" stroke="#648896" stroke-width="3"/><circle cx="120" cy="272" r="20" fill="#b73947"/><circle cx="180" cy="244" r="19" fill="#b73947"/><text x="65" y="136" font-size="16" fill="#243741">Map sections / burden and vascular spread</text><text x="79" y="423" font-size="16" fill="#243741">Record named segments and free sections</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Left lateral | left medial</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Right anterior | right posterior</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Adjoining free sections → I–IV</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Add V/P/E/F/R/C/N/M</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
