<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Breast carcinoma anatomical TNM: reporting anatomy and staging pathway"><title>Breast carcinoma anatomical TNM</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Breast carcinoma anatomical TNM</text><text x="28" y="75" font-size="16" fill="#243741">AJCC 8 anatomical staging</text><path d="M323 168V390" stroke="#648896" stroke-width="16"/><path d="M295 173V385" stroke="#a1bcc8" stroke-width="16"/><path d="M278 168C149 155 74 261 102 302C115 325 169 376 277 388" fill="#deedf1" stroke="#648896" stroke-width="4"/><circle cx="197" cy="276" r="28" fill="#b73947"/><circle cx="269" cy="191" r="10" fill="#c98126"/><text x="70" y="141" font-size="16" fill="#243741">Largest invasive focus</text><text x="76" y="423" font-size="16" fill="#243741">Skin • pectoralis • chest wall • nodes</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Largest invasive focus → size T</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Qualifying skin / chest wall → T4</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Axillary + IM + SC basins → N</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Grade + ER/PR/HER2 → prognostic stage</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
