<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Malignant bone tumours: Enneking / MSTS: reporting anatomy and staging pathway"><title>Malignant bone tumours: Enneking / MSTS</title><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#648896"/></marker></defs><rect width="960" height="600" fill="#fffaf3"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#243741">Malignant bone tumours: Enneking / MSTS</text><text x="28" y="75" font-size="16" fill="#243741">Enneking surgical staging</text><path d="M156 171L158 363M247 171L246 363" stroke="#648896" stroke-width="13"/><path d="M163 185V348H242V185Z" fill="#deedf1"/><ellipse cx="224" cy="269" rx="59" ry="43" fill="#b73947"/><path d="M247 258L303 228" stroke="#b73947" stroke-width="18"/><text x="80" y="140" font-size="16" fill="#243741">Cortex / compartment</text><text x="70" y="426" font-size="16" fill="#243741">Length • soft tissue • skip lesions</text><rect x="446" y="126" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="154" font-size="17" fill="#243741">1. Histology → low/high grade</text><path d="M675 194v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="212" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="240" font-size="17" fill="#243741">2. Intra / extracompartmental extent</text><path d="M675 280v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="298" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="326" font-size="17" fill="#243741">3. Skip lesions and metastases</text><path d="M675 366v15" stroke="#648896" stroke-width="3" marker-end="url(#arrow)"/><rect x="446" y="384" width="464" height="65" rx="9" fill="#eef3f4" stroke="#648896"/><text x="460" y="412" font-size="17" fill="#243741">4. Combine → Enneking stage</text><text x="32" y="524" font-size="15" fill="#243741">Original orientation schematic • red = example tumour / extension; amber = nodes or additional extent</text><text x="32" y="552" font-size="15" fill="#243741">Use the category table and named system. Drawing scale, contact and appearance do not assign a stage.</text></g></svg>
