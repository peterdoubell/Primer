<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">Adult transthoracic echo review sequence</title><desc id="desc">Original workflow diagram links acoustic windows to chamber assessment, valve and Doppler assessment, and an integrated conclusion. It does not reproduce ultrasound anatomy or simulate haemodynamics.</desc>
<rect width="900" height="490" rx="18" fill="#faf5ee"/>
<g fill="#30201d" font-family="sans-serif" text-anchor="middle"><text x="450" y="43" font-size="24">Adult TTE: windows → measurements → interpretation</text></g>
<g fill="#e4edeb" stroke="#527c78" stroke-width="2"><rect x="40" y="78" width="250" height="270" rx="12"/><rect x="325" y="78" width="250" height="270" rx="12"/><rect x="610" y="78" width="250" height="270" rx="12"/></g>
<g fill="#30201d" font-family="sans-serif" text-anchor="middle" font-size="19"><text x="165" y="120">Acquisition</text><text x="165" y="173">Parasternal</text><text x="165" y="213">Apical</text><text x="165" y="253">Subcostal</text><text x="165" y="293">Suprasternal</text><text x="450" y="120">Assess</text><text x="450" y="173">LV / RV and atria</text><text x="450" y="213">Valves + Doppler</text><text x="450" y="253">Filling assessment</text><text x="450" y="293">Pericardium + aorta</text><text x="735" y="120">Integrate</text><text x="735" y="173">Quality + method</text><text x="735" y="213">Clinical question</text><text x="735" y="253">Prior examination</text><text x="735" y="293">Critical communication</text><text x="450" y="402" font-size="17">Report measured values, supporting findings and limitations together.</text><text x="450" y="450" font-size="15">Original workflow schematic • Adult resting TTE • TEE and stress echo require dedicated protocols</text></g>
