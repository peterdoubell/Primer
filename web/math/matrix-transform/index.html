<body><main>
<a href="/app/#/node/math.4.linalg">Return to Linear Algebra</a>
<h1>A matrix as a transformation of the plane</h1>
<p class="lede">A 2 × 2 matrix moves every point of the plane. Its columns say where the two unit vectors land, and its determinant says how area scales.</p>
<div class="controls">
<div><label for="a">Top left a</label><input type="range" id="a" min="-3" max="3" step="0.5" value="2"><output id="a-out" for="a"></output></div>
<div><label for="b">Top right b</label><input type="range" id="b" min="-3" max="3" step="0.5" value="1"><output id="b-out" for="b"></output></div>
<div><label for="c">Bottom left c</label><input type="range" id="c" min="-3" max="3" step="0.5" value="1"><output id="c-out" for="c"></output></div>
<div><label for="d">Bottom right d</label><input type="range" id="d" min="-3" max="3" step="0.5" value="2"><output id="d-out" for="d"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="700" role="img" aria-label="The unit square and its image under the matrix, with the two column vectors. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
