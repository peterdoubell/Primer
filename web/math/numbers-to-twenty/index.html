</div>

<canvas id="graph" width="720" height="220" role="img" aria-label="Two frames of ten spaces, filled to show the number. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Question</th><th scope="col">Answer</th></tr></thead><tbody id="rows"></tbody></table>
