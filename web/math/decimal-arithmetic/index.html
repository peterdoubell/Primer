<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculating with decimals · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.2.decimals">Return to Decimals</a>
<h1>Calculating with decimals</h1>
<p class="lede">Decimals extend place value to tenths and hundredths. Line up the points to add; count the places to multiply.</p>
<div class="controls">
<div><label for="a">First number</label><input type="range" id="a" min="0" max="10" step="0.05" value="3.75"><output id="a-out" for="a"></output></div>
<div><label for="op">Operation</label><select id="op"><option value="add">Add</option><option value="subtract">Subtract</option><option value="multiply">Multiply</option></select></div>
<div><label for="b">Second number</label><input type="range" id="b" min="0" max="10" step="0.05" value="1.4"><output id="b-out" for="b"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="260" role="img" aria-label="A number line marking the two numbers and the answer. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Step</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
