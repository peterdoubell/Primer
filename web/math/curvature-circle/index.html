<h1>Curvature and the circle of best fit</h1>
<p class="lede">Curvature measures how fast a curve turns. At each point the osculating circle fits the curve best, and its radius is one over the curvature.</p>
<div class="controls">
<div><label for="a">Parabola y = ax²: a</label><input type="range" id="a" min="-2" max="2" step="0.25" value="0.5"><output id="a-out" for="a"></output></div>
<div><label for="x">Point x</label><input type="range" id="x" min="-2" max="2" step="0.25" value="0"><output id="x-out" for="x"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="700" role="img" aria-label="The parabola with its tangent line and osculating circle at the chosen point. The table below gives the same values."></canvas>
</figure>
