<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluating and composing functions · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.3.functions">Return to Functions</a>
<h1>Evaluating and composing functions</h1>
<p class="lede">A function turns each input into one output. Composing feeds the output of one function into another, and the order matters.</p>
<div class="controls">
<div><label for="f">Function f</label><select id="f"><option value="double">f(x) = 2x + 1</option><option value="square">f(x) = x²</option><option value="shift">f(x) = x − 3</option><option value="half">f(x) = x / 2</option><option value="abs">f(x) = |x|</option></select></div>
<div><label for="g">Function g</label><select id="g"><option value="square">g(x) = x²</option><option value="double">g(x) = 2x + 1</option><option value="shift">g(x) = x − 3</option><option value="half">g(x) = x / 2</option><option value="abs">g(x) = |x|</option></select></div>
<div><label for="x">Input x</label><input type="range" id="x" min="-5" max="5" step="0.5" value="2"><output id="x-out" for="x"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="460" role="img" aria-label="Graphs of f, g and f composed with g, with the chosen input marked. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Expression</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
