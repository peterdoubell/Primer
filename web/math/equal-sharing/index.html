<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharing into equal groups · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.1.division">Return to Division</a>
<h1>Sharing into equal groups</h1>
<p class="lede">Share the counters out one at a time. Whatever cannot be shared equally is left over.</p>
<div class="controls">
<div><label for="total">Counters to share</label><input type="range" id="total" min="1" max="60" step="1" value="23"><output id="total-out" for="total"></output></div>
<div><label for="groups">Groups</label><input type="range" id="groups" min="1" max="12" step="1" value="4"><output id="groups-out" for="groups"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="380" role="img" aria-label="Counters dealt into groups, with any left over shown apart. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Question</th><th scope="col">Answer</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
