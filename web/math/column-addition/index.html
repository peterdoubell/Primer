<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adding with tens and ones · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.1.addition">Return to Addition</a>
<h1>Adding with tens and ones</h1>
<p class="lede">Add the ones first. If they make ten or more, carry one ten.</p>
<div class="controls">
<div><label for="a">First number</label><input type="range" id="a" min="0" max="99" step="1" value="47"><output id="a-out" for="a"></output></div>
<div><label for="b">Second number</label><input type="range" id="b" min="0" max="99" step="1" value="38"><output id="b-out" for="b"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="260" role="img" aria-label="A number line with one jump for each number. The table below gives the same values."></canvas>
</figure>
<table><caption>Working</caption><thead><tr><th scope="col">Step</th><th scope="col">Working</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
