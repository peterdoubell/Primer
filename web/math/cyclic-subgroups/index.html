<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subgroups of the integers modulo n · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.5.abstract">Return to Abstract Algebra</a>
<h1>Subgroups of the integers modulo n</h1>
<p class="lede">The integers modulo n form a group under addition. Each element generates a subgroup, and the size of every subgroup divides n.</p>
<div class="controls">
<div><label for="n">Modulus n</label><input type="range" id="n" min="2" max="24" step="1" value="12"><output id="n-out" for="n"></output></div>
<div><label for="g">Element g</label><input type="range" id="g" min="0" max="23" step="1" value="8"><output id="g-out" for="g"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="700" role="img" aria-label="The elements of the group round a circle, with the generated subgroup filled in and joined. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
