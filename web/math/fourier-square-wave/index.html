<a href="/app/#/node/math.5.functional">Return to Functional Analysis</a>
<h1>Approximating a function by sine waves</h1>
<p class="lede">In a space of functions, sine waves act like perpendicular axes. Adding more of them brings the sum closer to a square wave when distance is measured by average squared error.</p>
<div class="controls">
<div><label for="terms">Number of sine terms</label><input type="range" id="terms" min="1" max="25" step="1" value="3"><output id="terms-out" for="terms"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="460" role="img" aria-label="A square wave and the sum of the chosen number of sine terms. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
