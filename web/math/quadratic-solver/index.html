<html lang="en">
<head>

<title>Solving a quadratic three ways · Primer</title>

<body><main>
<a href="/app/#/node/math.3.quadratics">Return to Quadratic Equations</a>
<h1>Solving a quadratic three ways</h1>
<p class="lede">Set a, b and c in ax² + bx + c = 0. The discriminant tells how many real roots there are before you find them.</p>
<div class="controls">
<div><label for="a">a</label><input type="range" id="a" min="-3" max="3" step="0.5" value="1"><output id="a-out" for="a"></output></div>
<div><label for="b">b</label><input type="range" id="b" min="-8" max="8" step="1" value="-2"><output id="b-out" for="b"></output></div>
<div><label for="c">c</label><input type="range" id="c" min="-8" max="8" step="1" value="-3"><output id="c-out" for="c"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="460" role="img" aria-label="Graph of the parabola with its vertex, axis of symmetry and any real roots. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
