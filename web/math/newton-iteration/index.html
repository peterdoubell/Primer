<a href="/app/#/node/math.5.numerical">Return to Numerical Analysis</a>
<h1>Newton’s method and how fast it converges</h1>
<p class="lede">To find √a, guess x, then replace x by the average of x and a/x. Each step roughly doubles the number of correct digits.</p>
<div class="controls">
<div><label for="a">Find the square root of</label><input type="range" id="a" min="2" max="50" step="1" value="2"><output id="a-out" for="a"></output></div>
<div><label for="x0">First guess</label><input type="range" id="x0" min="1" max="10" step="1" value="1"><output id="x0-out" for="x0"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="460" role="img" aria-label="Bars showing the number of correct digits after each Newton step, with bisection for comparison. The table below gives the same values."></canvas>
</figure>
<table><caption>Iterations</caption><thead><tr><th scope="col">Step</th><th scope="col">Estimate</th><th scope="col">Error</th><th scope="col">Correct digits</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
