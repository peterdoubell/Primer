<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From roots to a polynomial · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.3.polynomials">Return to Polynomials</a>
<h1>From roots to a polynomial</h1>
<p class="lede">Choose three roots and a leading coefficient. The factored form multiplies out to the expanded form, and the graph crosses the axis at each root.</p>
<div class="controls">
<div><label for="a">Leading coefficient</label><input type="range" id="a" min="-3" max="3" step="1" value="1"><output id="a-out" for="a"></output></div>
<div><label for="r1">Root 1</label><input type="range" id="r1" min="-4" max="4" step="1" value="-2"><output id="r1-out" for="r1"></output></div>
<div><label for="r2">Root 2</label><input type="range" id="r2" min="-4" max="4" step="1" value="1"><output id="r2-out" for="r2"></output></div>
<div><label for="r3">Root 3</label><input type="range" id="r3" min="-4" max="4" step="1" value="3"><output id="r3-out" for="r3"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="460" role="img" aria-label="Graph of the cubic with its roots marked on the x-axis. The table below gives the same values."></canvas>
</figure>
<table><caption>The polynomial</caption><thead><tr><th scope="col">Property</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
