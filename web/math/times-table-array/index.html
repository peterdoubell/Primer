<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rows and columns: the times tables · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.1.multiplication">Return to Multiplication</a>
<h1>Rows and columns: the times tables</h1>
<p class="lede">Multiplying counts equal rows. Change the rows and columns and read the table.</p>
<div class="controls">
<div><label for="a">Rows</label><input type="range" id="a" min="1" max="12" step="1" value="4"><output id="a-out" for="a"></output></div>
<div><label for="b">In each row</label><input type="range" id="b" min="1" max="12" step="1" value="6"><output id="b-out" for="b"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="420" role="img" aria-label="An array of dots in rows and columns. The table below gives the same values."></canvas>
</figure>
<table><caption>The times table for the number of rows</caption><thead><tr><th scope="col">Fact</th><th scope="col">Answer</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
