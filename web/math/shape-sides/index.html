<body><main>
<a href="/app/#/node/math.0.shapes">Return to Shapes All Around</a>
<h1>Shapes and their sides</h1>
<p class="lede">Choose a shape. Count its straight sides and its corners.</p>
<div class="controls">
<div><label for="shape">Shape</label><select id="shape"><option value="circle">Circle</option><option value="triangle">Triangle</option><option value="square">Square</option><option value="rectangle">Rectangle</option><option value="pentagon">Pentagon</option><option value="hexagon">Hexagon</option></select></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="300" role="img" aria-label="The chosen shape with its corners marked. The table below gives the same values."></canvas>
</figure>
<table><caption>All six shapes</caption><thead><tr><th scope="col">Shape</th><th scope="col">Straight sides</th><th scope="col">Corners</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
