<h1>Sets: union, intersection and counting</h1>
<p class="lede">Two sets drawn from the numbers 1 to 12. Count their union without counting anything twice.</p>
<div class="controls">
<div><label for="a">Set A</label><select id="a"><option value="even">even numbers</option><option value="odd">odd numbers</option><option value="three">multiples of 3</option><option value="prime">primes</option><option value="big">numbers above 6</option><option value="square">square numbers</option></select></div>
<div><label for="b">Set B</label><select id="b"><option value="three">multiples of 3</option><option value="even">even numbers</option><option value="odd">odd numbers</option><option value="prime">primes</option><option value="big">numbers above 6</option><option value="square">square numbers</option></select></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="200" role="img" aria-label="The numbers 1 to 12, coloured by which set they belong to. The table below gives the same values."></canvas>
</figure>
<table><caption>Sets</caption><thead><tr><th scope="col">Set</th><th scope="col">Members</th><th scope="col">Size</th></tr></thead><tbody id="rows"></tbody></table>
