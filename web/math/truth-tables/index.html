<body><main>
<a href="/app/#/node/math.5.logic">Return to Logic and Set Theory</a>
<h1>Truth tables and logical equivalence</h1>
<p class="lede">Two formulas are equivalent when they have the same truth value in every case. A truth table checks every case.</p>
<div class="controls">
<div><label for="f">First formula</label><select id="f"><option value="imp">P → Q</option><option value="and">P ∧ Q</option><option value="or">P ∨ Q</option><option value="iff">P ↔ Q</option><option value="nand">¬(P ∧ Q)</option><option value="nor">¬(P ∨ Q)</option><option value="taut">P ∨ ¬P</option></select></div>
<div><label for="g">Second formula</label><select id="g"><option value="ornot">¬P ∨ Q</option><option value="contra">¬Q → ¬P</option><option value="conv">Q → P</option><option value="demorgan">¬P ∨ ¬Q</option><option value="demorgan2">¬P ∧ ¬Q</option><option value="both">(P → Q) ∧ (Q → P)</option><option value="absurd">P ∧ ¬P</option></select></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="240" role="img" aria-label="A coloured truth table for the two formulas, green for true and red for false. The table below gives the same values."></canvas>
</figure>
<table><caption>Truth table</caption><thead><tr><th scope="col">P</th><th scope="col">Q</th><th scope="col">First formula</th><th scope="col">Second formula</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
