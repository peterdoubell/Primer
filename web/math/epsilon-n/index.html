<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convergence: for every ε there is an N · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.4.analysis">Return to Real Analysis</a>
<h1>Convergence: for every ε there is an N</h1>
<p class="lede">A sequence converges to L if, however small a tolerance ε you name, the terms eventually stay within ε of L. Choose ε and find the N that works.</p>
<div class="controls">
<div><label for="seq">Sequence</label><select id="seq"><option value="inv">aₙ = 1/n</option><option value="ratio">aₙ = (n + 1)/n</option><option value="alt">aₙ = (−1)ⁿ/n</option><option value="geo">aₙ = (1/2)ⁿ</option></select></div>
<div><label for="eps">Tolerance ε</label><input type="range" id="eps" min="0.01" max="0.5" step="0.01" value="0.1"><output id="eps-out" for="eps"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="460" role="img" aria-label="Terms of the sequence, the band of width epsilon around the limit, and the threshold N. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
