<h1>Counting corners, edges and faces</h1>
<p class="lede">Topology studies what survives stretching. Corners minus edges plus faces is the same for every way of drawing a surface, and it tells surfaces apart.</p>
<div class="controls">
<div><label for="solid">Surface</label><select id="solid"><option value="cube">Cube</option><option value="tetrahedron">Tetrahedron</option><option value="octahedron">Octahedron</option><option value="dodecahedron">Dodecahedron</option><option value="icosahedron">Icosahedron</option><option value="prism">Triangular prism</option><option value="torus">Torus cut into a 3 × 3 grid</option><option value="doubletorus">Two-holed torus (one standard cutting)</option></select></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="300" role="img" aria-label="Bars for the numbers of corners, edges and faces. The table below gives the same values."></canvas>
</figure>
<table><caption>All the surfaces</caption><thead><tr><th scope="col">Surface</th><th scope="col">Corners V</th><th scope="col">Edges E</th><th scope="col">Faces F</th><th scope="col">V − E + F</th></tr></thead><tbody id="rows"></tbody></table>
