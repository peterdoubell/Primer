<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partial derivatives and the gradient · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.4.multivar">Return to Multivariable Calculus</a>
<h1>Partial derivatives and the gradient</h1>
<p class="lede">A function of two variables has a slope in every direction. The gradient points in the direction of steepest ascent.</p>
<div class="controls">
<div><label for="surface">Function</label><select id="surface"><option value="bowl">f(x, y) = x² + y²</option><option value="saddle">f(x, y) = x² − y²</option><option value="product">f(x, y) = xy</option></select></div>
<div><label for="x">x</label><input type="range" id="x" min="-2" max="2" step="0.25" value="1"><output id="x-out" for="x"></output></div>
<div><label for="y">y</label><input type="range" id="y" min="-2" max="2" step="0.25" value="0.5"><output id="y-out" for="y"></output></div>
<div><label for="angle">Direction (degrees)</label><input type="range" id="angle" min="0" max="345" step="15" value="45"><output id="angle-out" for="angle"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="700" role="img" aria-label="A shaded map of the function with the gradient arrow and the chosen direction at the point. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
