<head>

<body><main>
<a href="/app/#/node/math.3.systems">Return to Systems of Equations</a>
<h1>Where two lines meet</h1>
<p class="lede">A system of two linear equations has one solution, none, or infinitely many. Move the lines to find each case.</p>
<div class="controls">
<div><label for="m1">Blue slope</label><input type="range" id="m1" min="-4" max="4" step="0.5" value="1"><output id="m1-out" for="m1"></output></div>
<div><label for="k1">Blue intercept</label><input type="range" id="k1" min="-8" max="8" step="1" value="2"><output id="k1-out" for="k1"></output></div>
<div><label for="m2">Orange slope</label><input type="range" id="m2" min="-4" max="4" step="0.5" value="-1"><output id="m2-out" for="m2"></output></div>
<div><label for="k2">Orange intercept</label><input type="range" id="k2" min="-8" max="8" step="1" value="4"><output id="k2-out" for="k2"></output></div>
</div>
<figure>
<canvas id="graph" width="720" height="520" role="img"></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Step</th><th scope="col">Equation</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
