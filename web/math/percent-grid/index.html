<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Percent, fraction and decimal · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.2.percent">Return to Percentages</a>
<h1>Percent, fraction and decimal</h1>
<p class="lede">Percent means “out of a hundred”. The grid has 100 squares.</p>
<div class="controls">
<div><label for="p">Percent</label><input type="range" id="p" min="0" max="100" step="1" value="35"><output id="p-out" for="p"></output></div>
<div><label for="whole">Of this amount</label><input type="range" id="whole" min="10" max="500" step="10" value="80"><output id="whole-out" for="whole"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="520" role="img" aria-label="A ten by ten grid with one square shaded for each percent. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Form</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
