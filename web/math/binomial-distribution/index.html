<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The binomial distribution · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.4.prob-theory">Return to Probability Theory</a>
<h1>The binomial distribution</h1>
<p class="lede">Repeat a trial n times, each succeeding with probability p. The bars give the chance of each number of successes.</p>
<div class="controls">
<div><label for="n">Trials n</label><input type="range" id="n" min="1" max="30" step="1" value="10"><output id="n-out" for="n"></output></div>
<div><label for="p">Chance of success p</label><input type="range" id="p" min="0" max="1" step="0.05" value="0.3"><output id="p-out" for="p"></output></div>
<div><label for="k">Successes k</label><input type="range" id="k" min="0" max="30" step="1" value="3"><output id="k-out" for="k"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="460" role="img" aria-label="Bar chart of the probability of each number of successes. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
