<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solving a linear equation · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.3.linear">Return to Linear Equations</a>
<h1>Solving a linear equation</h1>
<p class="lede">Solve ax + b = cx + d. Each side is a line; the solution is where the lines cross.</p>
<div class="controls">
<div><label for="a">a</label><input type="range" id="a" min="-6" max="6" step="1" value="2"><output id="a-out" for="a"></output></div>
<div><label for="b">b</label><input type="range" id="b" min="-6" max="6" step="1" value="-3"><output id="b-out" for="b"></output></div>
<div><label for="c">c</label><input type="range" id="c" min="-6" max="6" step="1" value="-1"><output id="c-out" for="c"></output></div>
<div><label for="d">d</label><input type="range" id="d" min="-6" max="6" step="1" value="6"><output id="d-out" for="d"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="460" role="img" aria-label="Two lines, one for each side of the equation, and their crossing point. The table below gives the same values."></canvas>
</figure>
<table><caption>Working</caption><thead><tr><th scope="col">Step</th><th scope="col">Equation</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
