<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measuring with small and large units · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.1.measurement">Return to Measuring Things</a>
<h1>Measuring with small and large units</h1>
<p class="lede">Choose what to measure. A big unit is made of many small ones.</p>
<div class="controls">
<div><label for="kind">Measure</label><select id="kind"><option value="length">Length</option><option value="mass">Mass</option><option value="capacity">Liquid capacity</option></select></div>
<div><label for="value">Amount in the small unit</label><input type="range" id="value" min="0" max="5000" step="50" value="1250"><output id="value-out" for="value"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="260" role="img" aria-label="A scale in the large unit with a bar showing the amount. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Question</th><th scope="col">Answer</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
