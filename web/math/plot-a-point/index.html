<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plotting a point · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.2.coordinates">Return to The Coordinate Plane</a>
<h1>Plotting a point</h1>
<p class="lede">A point is named by two numbers: across first, then up. Move the point and read where it lies.</p>
<div class="controls">
<div><label for="x">x (across)</label><input type="range" id="x" min="-6" max="6" step="1" value="3"><output id="x-out" for="x"></output></div>
<div><label for="y">y (up)</label><input type="range" id="y" min="-6" max="6" step="1" value="-2"><output id="y-out" for="y"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="560" role="img" aria-label="A coordinate grid with the point and its two mirror images. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Question</th><th scope="col">Answer</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
