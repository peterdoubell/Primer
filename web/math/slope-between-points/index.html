<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The line through two points · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.3.slope">Return to Slope and Lines</a>
<h1>The line through two points</h1>
<p class="lede">Slope is rise over run. Two points fix a line, its slope and its equation.</p>
<div class="controls">
<div><label for="x1">First point x</label><input type="range" id="x1" min="-6" max="6" step="1" value="-2"><output id="x1-out" for="x1"></output></div>
<div><label for="y1">First point y</label><input type="range" id="y1" min="-6" max="6" step="1" value="-1"><output id="y1-out" for="y1"></output></div>
<div><label for="x2">Second point x</label><input type="range" id="x2" min="-6" max="6" step="1" value="4"><output id="x2-out" for="x2"></output></div>
<div><label for="y2">Second point y</label><input type="range" id="y2" min="-6" max="6" step="1" value="3"><output id="y2-out" for="y2"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="700" role="img" aria-label="A grid with the two points, the line through them, and the rise and run. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
