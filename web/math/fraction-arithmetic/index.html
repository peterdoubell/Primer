<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adding, multiplying and comparing fractions · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.2.fractions">Return to Fractions</a>
<h1>Adding, multiplying and comparing fractions</h1>
<p class="lede">Set two fractions and an operation. To add or subtract, first make the bottom numbers the same.</p>
<div class="controls">
<div><label for="n1">First top number</label><input type="range" id="n1" min="0" max="12" step="1" value="2"><output id="n1-out" for="n1"></output></div>
<div><label for="d1">First bottom number</label><input type="range" id="d1" min="1" max="12" step="1" value="3"><output id="d1-out" for="d1"></output></div>
<div><label for="op">Operation</label><select id="op"><option value="add">Add</option><option value="subtract">Subtract</option><option value="multiply">Multiply</option><option value="divide">Divide</option></select></div>
<div><label for="n2">Second top number</label><input type="range" id="n2" min="0" max="12" step="1" value="3"><output id="n2-out" for="n2"></output></div>
<div><label for="d2">Second bottom number</label><input type="range" id="d2" min="1" max="12" step="1" value="4"><output id="d2-out" for="d2"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="300" role="img" aria-label="Bars from 0 to 4 showing the two fractions and the answer. The table below gives the same values."></canvas>
</figure>
<table><caption>Values</caption><thead><tr><th scope="col">Step</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
