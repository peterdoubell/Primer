<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharing in a ratio and scaling up · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>
<script defer src="lab.js"></script>
</head>
<body><main>
<a href="/app/#/node/math.2.ratio">Return to Ratio and Proportion</a>
<h1>Sharing in a ratio and scaling up</h1>
<p class="lede">A ratio compares parts. Share an amount in the ratio, or scale a recipe and keep the ratio the same.</p>
<div class="controls">
<div><label for="a">First part</label><input type="range" id="a" min="1" max="10" step="1" value="2"><output id="a-out" for="a"></output></div>
<div><label for="b">Second part</label><input type="range" id="b" min="1" max="10" step="1" value="3"><output id="b-out" for="b"></output></div>
<div><label for="total">Amount to share</label><input type="range" id="total" min="10" max="200" step="5" value="60"><output id="total-out" for="total"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="220" role="img" aria-label="A bar divided into equal parts, coloured to show the two shares. The table below gives the same values."></canvas>
</figure>
<table><caption>The same ratio at different scales</caption><thead><tr><th scope="col">Scale</th><th scope="col">First</th><th scope="col">Second</th><th scope="col">Together</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
