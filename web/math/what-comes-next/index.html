<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What comes next? · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">
<script defer src="/app/activities/kit.js"></script>

</head>
<body><main>
<a href="/app/#/node/math.0.patterns">Return to Patterns</a>
<h1>What comes next?</h1>
<p class="lede">A pattern follows a rule. Find the rule and you can say what comes next.</p>
<div class="controls">
<div><label for="kind">Pattern</label><select id="kind"><option value="ab">red, blue, red, blue</option><option value="aab">red, red, blue</option><option value="abc">red, blue, green</option><option value="plus2">growing by 2</option><option value="plus3">growing by 3</option></select></div>
<div><label for="n">How many are shown</label><input type="range" id="n" min="3" max="10" step="1" value="6"><output id="n-out" for="n"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="240" role="img" aria-label="The pattern drawn in order, with a question mark for the next item. The table below gives the same values."></canvas>
</figure>
<table><caption>The pattern so far</caption><thead><tr><th scope="col">Position</th><th scope="col">Item</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
