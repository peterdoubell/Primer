<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What each digit is worth · Primer</title>
<link rel="stylesheet" href="/app/activities/kit.css">

<body><main>
<a href="/app/#/node/math.1.place-value">Return to Place Value</a>
<h1>What each digit is worth</h1>
<p class="lede">The place of a digit tells you its value. Move the slider and read each column.</p>
<div class="controls">
<div><label for="n">Number</label><input type="range" id="n" min="0" max="9999" step="1" value="3407"><output id="n-out" for="n"></output></div>
</div>
<p id="sum" class="big" style="font-weight:700"></p>
<figure>
<canvas id="graph" width="720" height="320" role="img" aria-label="Four columns of counters, one for each place. The table below gives the same values."></canvas>
</figure>
<table><caption>Digits</caption><thead><tr><th scope="col">Place</th><th scope="col">Digit</th><th scope="col">Value</th></tr></thead><tbody id="rows"></tbody></table>
<p id="result" role="status"></p>
</main></body></html>
